[package]
name = "essaim"
version = "0.2.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
essaim-core = { path = "../crates/core" }
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
