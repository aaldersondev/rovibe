name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The server embeds the built UI, so it has to exist before cargo runs.
      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - uses: Swatinem/rust-cache@v2
      - name: Test the server
        run: cargo test -p rovibe-core
      # The interface, in a real browser, against a server started for it.
      - name: Test the interface
        working-directory: ui
        run: |
          npx playwright install chromium
          npx playwright test
      - name: Keep what the interface looked like when a test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interface-test-results
          path: ui/test-results
