name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The server embeds the built UI, so it has to exist before cargo runs.
      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - uses: Swatinem/rust-cache@v2
      - name: Test the server
        run: cargo test -p rovibe-core
